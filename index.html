<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--card:#fff;--tx:#3a1530;--mu:#7d5a72;--pk:#fe75a9;--pks:#ffdbe9;--mg:#fe75a9;--mgd:#f95b98;--yl:#ffd23f;--pt:#e0447f;--onpk:#3a1530;--bl:#2f7dd1;--bls:#dcecff;--ok:#1b8a4b;--bad:#c62828;--bd:#ffc7dc;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pks);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pks);color:var(--tx);border-bottom:3px solid var(--yl);box-shadow:0 3px 12px #d4af3755}
.wrap{max-width:1050px;margin:0 auto;padding:0 14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:60px;height:60px;border-radius:50%;border:2px solid var(--yl);display:block}
.logo{font-family:"Pacifico","Brush Script MT","Segoe Script",cursive;font-size:1.85rem;color:var(--pt);line-height:1.1}
.tag{font-size:.85rem;color:var(--mu)}
h1::before{content:"✿ ";color:var(--pk)}
h1::after{content:"";display:block;height:3px;width:90px;margin-top:4px;border-radius:3px;background:linear-gradient(90deg,var(--yl),transparent)}
nav{display:flex;gap:6px;padding:4px 0 10px}
nav button{flex:1;background:var(--mg);color:var(--onpk);border:2px solid transparent;border-radius:999px;padding:9px 6px;font:600 .92rem inherit;font-family:inherit;cursor:pointer;min-height:44px}
nav button[aria-current=page]{background:var(--yl);color:#3a2a00;border-color:#fff}
.cnt{background:var(--yl);color:#3a2a00;border-radius:99px;padding:0 7px;font-size:.78rem;margin-left:3px}
nav button[aria-current=page] .cnt{background:var(--mg);color:var(--onpk)}
main{padding:18px 14px 40px;max-width:1050px;margin:0 auto}
h1,h2,h3{margin:.2em 0 .5em;color:var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--pks);color:var(--tx);border:2px solid var(--bd);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--mg);color:var(--onpk);border-color:var(--mg)}
.gf{display:flex;gap:10px;margin:6px 0 12px}
.gbtn{flex:1;max-width:190px;border:3px solid;border-radius:10px;padding:10px;font:700 1rem inherit;font-family:inherit;cursor:pointer;min-height:46px}
.gbtn.h{background:var(--bls);border-color:var(--bl);color:var(--bl)}
.gbtn.m{background:var(--pks);border-color:var(--mg);color:#8a1f4e}
.gbtn[aria-pressed=true].h{background:var(--bl);color:#fff}
.gbtn[aria-pressed=true].m{background:var(--mg);color:var(--onpk)}
input,select,textarea{width:100%;font:inherit;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);min-height:44px}
label{display:block;font-weight:600;margin:10px 0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 8px #c2187a14}
.ph{aspect-ratio:1/1;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,var(--pks),var(--card));overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-weight:700}
.pr{font-size:1.2rem;font-weight:800;color:var(--tx)}
.av{font-size:.85rem;color:var(--ok)}.av.low{color:#b26a00;font-weight:700}.av.no{color:var(--bad);font-weight:700}
.badge{position:absolute;top:8px;left:8px;background:var(--yl);color:#3a2a00;font-weight:800;font-size:.78rem;padding:3px 10px;border-radius:99px;z-index:1}
.badge.s{background:var(--mg);color:var(--onpk);top:8px;left:auto;right:8px}
.badge.m{background:#555;color:#fff;top:auto;bottom:auto;left:8px;margin-top:26px;font-weight:600}
.btn{background:var(--mg);color:var(--onpk);border:0;border-radius:12px;padding:11px 16px;font:700 1rem inherit;font-family:inherit;cursor:pointer;min-height:44px;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{background:var(--mgd)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.y{background:var(--yl);color:#3a2a00}.btn.o{background:transparent;color:var(--tx);border:2px solid var(--mg)}.btn.g{background:#1faa59;color:#fff}.btn.r{color:#fff}.btn.r{background:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}

const fromDb=(c,r)=>c==="products"?Object.assign({},r,{desc:r.descr}):c==="orders"?Object.assign({},r,{at:r.created_at}):r;
const toDb=(c,o)=>{const r=Object.assign({},o);if(c==="products"){r.descr=r.desc;delete r.desc;delete r.sample}if(c==="orders"){if(r.at)r.created_at=r.at;delete r.at}if(!r.id)delete r.id;return r};
async function load(){
  if(!sb){["products","news","orders"].forEach(c=>S[c]=ls.get("ca_"+c,[]));S.cfg=Object.assign(S.cfg,ls.get("ca_cfg",{}));return}
  const [p,n,c]=await Promise.all([sb.from("products").select("*").order("name"),sb.from("news").select("*"),sb.from("settings").select("*").eq("id",1).maybeSingle()]);
  S.products=(p.data||[]).map(r=>fromDb("products",r));S.news=n.data||[];if(c.data)Object.assign(S.cfg,c.data);
  if(S.admin){const o=await sb.from("orders").select("*").order("created_at",{ascending:false});S.orders=(o.data||[]).map(r=>fromDb("orders",r))}
}
async function init(){
  if(sb){try{const{data}=await sb.auth.getSession();if(data.session){S.admin=(await sb.rpc("is_admin")).data===true}}catch(e){}}else S.admin=true;
  try{await load()}catch(e){toast("No se pudieron cargar los datos")}
  render();
}
async function put(c,o,quiet){
  if(sb){
    const row=toDb(c,o),q=sb.from(c);
    const {error}=o.id?await q.upsert(row):await q.insert(row);
    if(error){toast("Error: "+error.message);throw error}
    if(!quiet){await load();render()}
    return;
  }
  const id=o.id||uid(),d=Object.assign({},o);delete d.id;
  const a=S[c],i=a.findIndex(x=>x.id===id),n=Object.assign({id},d);i<0?a.push(n):a[i]=n;ls.set("ca_"+c,a);if(!quiet)render();
}
async function del(c,id){
  if(sb){const {error}=await sb.from(c).delete().eq("id",id);if(error){toast("Error: "+error.message);return}await load();render()}
  else{S[c]=S[c].filter(x=>x.id!==id);ls.set("ca_"+c,S[c]);render()}
}
async function saveCfg(){
  if(sb){const {error}=await sb.from("settings").upsert({id:1,low:S.cfg.low,channel:S.cfg.channel||""});if(error)toast("Error: "+error.message)}
  else ls.set("ca_cfg",S.cfg);
}
async function upImg(f){
  if(sb&&S.admin){try{const path=uid()+"-"+f.name.replace(/[^\w.]/g,"_");const r=await sb.storage.from("images").upload(path,f);if(r.error)throw r.error;return sb.storage.from("images").getPublicUrl(path).data.publicUrl}catch(e){toast("No se pudo subir la imagen: "+e.message)}}
  return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
}

    b=S.orders.length?S.orders.slice().sort((a,b)=>(b.at||"").localeCompare(a.at||"")).map(o=>'<div class="box"><div class="row"><b>'+esc(o.name)+"</b><span>"+money(o.total)+" · "+esc(o.pay)+'</span></div><ul>'+(o.items||[]).map(i=>"<li>"+i.qty+" × "+esc(i.name)+" — "+money(i.qty*i.price)+"</li>").join("")+'</ul><p>'+(o.delivery?'🛵 <b>Delivery:</b> '+locHtml(o.location):'🏬 Retiro en tienda')+'</p><div class="row"><span class="note">'+new Date(o.at).toLocaleString("es-DO")+" · "+(o.status==="recibido"?"✅ Recibido":"⏳ Esperando mensaje de WhatsApp")+'</span><span>'+(o.status!=="recibido"?'<button class="btn sm g" data-a="orecv" data-id="'+esc(o.id)+'">Marcar recibido</button> ':"")+'<button class="btn sm r" data-a="odel" data-id="'+esc(o.id)+'">Eliminar</button></span></div></div>').join(""):'<p class="note">Todavía no hay pedidos. Los pedidos aparecen aquí cuando un cliente los prepara; confírmalos al recibir su mensaje de WhatsApp.</p>';
  }else{
    b='<div class="box"><label>Alertar cuando queden este número de unidades o menos</label><input id="c-low" type="number" min="0" value="'+S.cfg.low+'"><label>Enlace del canal de difusión de WhatsApp (vacío = “Próximamente”)</label><input id="c-ch" type="url" value="'+esc(S.cfg.channel||"")+'" placeholder="https://whatsapp.com/channel/…"><p><button class="btn" data-a="csave">Guardar ajustes</button></p></div>';
  }
  return '<h1>Administración</h1>'+(sb?'<p><button class="btn sm o" data-a="logout">Cerrar sesión</button></p>':'<div class="alert">Modo local: Supabase aún no está configurado, así que los cambios se guardan solo en este navegador.</div>')+'<div class="tabs">'+T.map(t=>'<button class="chip" data-a="atab" data-id="'+t[0]+'" aria-pressed="'+(S.aTab===t[0])+'">'+t[1]+"</button>").join("")+"</div>"+b;
}

/* ---- Acciones ---- */
const A={
  go(id){S.view=id;S.sent=null;S.edit=null;location.hash=id;render();scrollTo(0,0)},
  scroll(){document.getElementById("cat-sec").scrollIntoView({behavior:"smooth"})},
  cat(id){S.cat=id;S.g="";render()},
  g(id){S.g=S.g===id?"":id;render()},
  add(id){const p=prods().find(x=>x.id===id);if(!p)return;const q=(S.cart[id]||0)+1;if(q>p.stock)return;S.cart[id]=q;saveCart();toast("✓ "+p.name+" agregado al carrito");render()},
  inc(id){A.add(id)},
  dec(id){if(--S.cart[id]<=0)delete S.cart[id];saveCart();render()},
  rm(id){delete S.cart[id];saveCart();render()},
  async order(){
    const it=cartItems(); if(!S.cname||!S.cname.trim()){toast("Escribe el nombre para la factura");$("#cn").focus();return}
    if(!S.pay){toast("Elige efectivo o transferencia");return}
    const dl=S.deliv==="1";if(dl&&!(S.loc||"").trim()){toast("Escribe la ubicación para el delivery");$("#loc").focus();return}
    const o={name:S.cname.trim(),pay:S.pay,delivery:dl,location:dl?S.loc.trim():"",total:cartTotal(),items:it.map(i=>({name:i.name,qty:i.qty,price:i.price})),at:new Date().toISOString(),status:"pendiente"};
    const r=Channel.send(o);
    try{await put("orders",o,true)}catch(e){}
    S.sent={url:r.url,o};render();scrollTo(0,0);
  },
  sentdone(){S.cart={};saveCart();S.sent=null;S.cname="";S.pay="";S.deliv="";S.loc="";render();toast("Listo. La tienda te confirmará por WhatsApp.")},
  sentback(){S.sent=null;render()},
  atab(id){S.aTab=id;S.edit=null;render()},
  pnew(){S.edit={cat:CATS[0],gender:"b"};render()},
  pedit(id){S.edit=Object.assign({},S.products.find(x=>x.id===id));render()},
  nnew(){S.edit={};render()},
  nedit(id){S.edit=Object.assign({},S.news.find(x=>x.id===id));render()},
  pcancel(){S.edit=null;render()},
  async psave(){
    const n=$("#f-name").value.trim(); if(!n){toast("Falta el nombre");return}
    const cat=$("#f-cat").value,e=S.edit;
    const o={id:e.id,name:n,desc:$("#f-desc").value.trim(),cat,gender:cat==="Maquillaje"?"b":$("#f-g").value,price:Number($("#f-price").value)||0,stock:Math.max(0,parseInt($("#f-stock").value)||0),sale:$("#f-sale").checked,special:$("#f-sp").checked};
    if(e.img)o.img=e.img; await put("products",o);S.edit=null;toast("Producto guardado");render();
  },
  async pdel(id){if(confirm("¿Eliminar este producto?"))await del("products",id)},
  async login(){const {error}=await sb.auth.signInWithPassword({email:$("#lg-e").value.trim(),password:$("#lg-p").value});if(error){toast("Correo o contraseña incorrectos");return}await init()},
  async logout(){await sb.auth.signOut();S.admin=false;S.orders=[];render()},
  async seed(){for(const p of SAMPLES){const o=Object.assign({},p);delete o.id;delete o.sample;await put("products",o,true)}await load();render();toast("Ejemplos cargados: edítalos o elimínalos")},
  async nsave(){
    const t=$("#n-title").value.trim(); if(!t){toast("Falta el título");return}
    const e=S.edit,o={id:e.id,title:t,text:$("#n-text").value,date:$("#n-date").value}; if(e.img)o.img=e.img;
    await put("news",o);S.edit=null;toast("Publicación guardada");render();
  },
  async ndel(id){if(confirm("¿Quitar esta publicación?"))await del("news",id)},
  async orecv(id){const o=S.orders.find(x=>x.id===id);await put("orders",Object.assign({},o,{status:"recibido"}))},
  async odel(id){if(confirm("¿Eliminar este pedido?"))await del("orders",id)},
  async csave(){S.cfg.low=Math.max(0,parseInt($("#c-low").value)||0);S.cfg.channel=$("#c-ch").value.trim();await saveCfg();toast("Ajustes guardados");render()}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.id)});
document.addEventListener("input",e=>{
  const k=e.target.dataset.in; if(!k)return;
  if(k==="q"){S.q=e.target.value;$("#grid").innerHTML=gridHtml()}
  else if(k==="cname")S.cname=e.target.value;
  else if(k==="pay")S.pay=e.target.value;
  else if(k==="deliv"){S.deliv=e.target.value;render()}
  else if(k==="loc")S.loc=e.target.value;
  else if(k==="fcat"){const g=$("#f-gw");if(g)g.hidden=e.target.value==="Maquillaje"}
});
document.addEventListener("change",async e=>{
  if(e.target.dataset.in==="fimg"&&e.target.files[0]){toast("Subiendo imagen…");S.edit.img=await upImg(e.target.files[0]);
    const keep={};document.querySelectorAll("#app input[id],#app textarea[id],#app select[id]").forEach(x=>keep[x.id]=x.type==="checkbox"?x.checked:x.value);
    render();for(const k in keep){const x=document.getElementById(k);if(x)x.type==="checkbox"?x.checked=keep[k]:x.value=keep[k]}toast("Imagen lista ✓")}
});
function route(){const h=location.hash.slice(1);if(["catalogo","novedades","carrito","contacto","admin"].includes(h)&&h!==S.view){S.view=h;render()}}
addEventListener("hashchange",route);route();render();init();
</script>
</body>
